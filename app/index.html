<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>anycube</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- The application by itself: js/main.js mounts it here. -->
<div class="app" id="app"></div>
<template id="local-update-button">
  <button class="button quiet update-trigger" type="button" aria-label="Check for updates" title="Check for updates">
    <span aria-hidden="true">↻</span><span class="wide-only">Check for updates</span>
  </button>
</template>
<dialog class="app-dialog" id="updates" aria-labelledby="updates-title">
  <h2 id="updates-title">Check for updates</h2>
  <p id="update-status" role="status"></p>
  <progress id="update-progress" aria-label="Update progress" hidden></progress>
  <details id="update-notes" hidden>
    <summary>Release notes</summary>
    <pre></pre>
  </details>
  <form method="dialog">
    <button class="button" id="update-later" type="button" autofocus>Later</button>
    <button class="button primary" id="update-install" type="button" hidden>Install update and restart</button>
  </form>
</dialog>
</body>
</html>
