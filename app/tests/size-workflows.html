<!doctype html>
<meta charset="utf-8">
<title>Camera and robot size workflows</title>
<link rel="stylesheet" href="../app.css">
<div class="app" id="app"></div>
<pre id="result">Running…</pre>
<script type="module">
import { detectCubeSize } from "../js/detect.js";
import { mount } from "../js/app.js";
import { SCAN_STEPS } from "../js/camera.js";
import { COLOURS, picture, quad } from "./pictures.mjs";
import { mockServer, json, PHOTOS } from "./robot-mock.mjs";

const result = document.querySelector("#result");
const $ = id => document.getElementById(id);
const check = (value, message) => { if (!value) throw Error(message); };
async function until(predicate) {
  const end = performance.now() + 12000;
  while (!predicate()) {
    if (performance.now() > end) throw Error("Timed out: " + predicate + "\n" + document.body.innerText.slice(-1500));
    await new Promise(resolve => setTimeout(resolve, 40));
  }
}

try {
  let clearPose, poseAt, sizePhotoAt;
  const pulls = [], sizeTimings = [];
  const mock = mockServer({ sizePhoto: true, onSizePose() {
    poseAt = performance.now();
    clearPose();
  }, onSizePhoto() { sizePhotoAt = performance.now(); pulls.length = 0; }, identify: true, ports: [], size: 3, settleMs: 80 });
  const source = document.createElement("canvas");
  source.width = 480;
  source.height = 240;
  const ctx = source.getContext("2d");
  let pixels;
  function showFace(n, colour = 1) {
    const image = picture({ W: 480, H: 240, n, corners: n ? quad(88, 120, 132) : null, stickers: Array(n*n).fill(colour) });
    pixels = new ImageData(image.data, 480, 240);
    ctx.putImageData(pixels, 0, 0);
  }
  showFace(0);
  let lastHold = -1;
  let cube;
  setInterval(() => {
    if (mock.holding >= 0 && mock.holding !== lastHold) {
      showFace(cube, "URFDLB".indexOf(PHOTOS[mock.holding][0]));
    }
    lastHold = mock.holding;
    ctx.putImageData(pixels, 0, 0);
  }, 20);
  navigator.mediaDevices.getUserMedia = async () => source.captureStream(30);
  let cameras = [];
  navigator.mediaDevices.enumerateDevices = async () => cameras;
  const network = window.fetch;
  const requests = [];
  window.fetch = async (url, init) => {
    if (url === "/api/config") return json(200, { local:true, robots:true, max_size:7, browser_sizes:[], modes:["normal"], max_scramble_moves:5000 });
    if (url === "/api/check") return json(200, { ok:true });
    if (url.startsWith("/api/robot")) {
      if (url === "/api/robot/scan") check(JSON.parse(init.body).detect_size, "guessed a size before positioning");
      if (url === "/api/robot/measured-size") {
        const n = JSON.parse(init.body).size;
        check(sizePhotoAt - poseAt >= 79, "size photo preceded settle");
        if (native) {
          check(pulls.length >= 2, "size read reused a buffered frame");
          sizeTimings.push(Math.round(pulls.at(-1) - sizePhotoAt));
        }
        if ([3,4,5].includes(n)) requests.push(n);
      }
      return mock.fetch(url, init);
    }
    return network(url, init);
  };
  const app = await mount($("app"));
  $("sizes").children[5].click();
  $("tab-camera").click();
  cameras = ["FaceTime HD Camera", "Horia’s iPhone Desk View Camera", "Horia’s iPhone Camera"]
    .map((label, i) => ({ kind: "videoinput", label, deviceId: String(i) }));
  navigator.mediaDevices.dispatchEvent(new Event("devicechange"));
  await until(() => $("camera-source").options.length === 3);
  check($("camera-source").options[2].text === "Horia’s iPhone Camera", "rear camera in picker");
  check(!$("camera-source").textContent.includes("Desk View"), "Desk View excluded");
  cameras = [];
  navigator.mediaDevices.dispatchEvent(new Event("devicechange"));
  await until(() => $("camera-source").hidden);
  let nativeSession = null;
  const native = new URLSearchParams(location.search).has("native");
  if (native) {
    cameras = ["FaceTime HD Camera", "Horia’s iPhone Desk View Camera"]
      .map((label, i) => ({ kind: "videoinput", label, deviceId: String(i) }));
    window.anycubeNativeMac = true;
    const phone = { id: "external-phone", label: "Horia’s iPhone Camera" };
    window.webkit = { messageHandlers: { anycubeCamera: { async postMessage({ op, token, id }) {
      if (op === "list") return [phone];
      if (op === "start") {
        check(id === phone.id && !nativeSession, "unexpected capture start");
        nativeSession = token;
        return phone;
      }
      check(token === nativeSession, "stale bridge request");
      if (op === "stop") { nativeSession = null; return true; }
      check(op === "frame", "unknown bridge request");
      if (sizePhotoAt) pulls.push(performance.now());
      return source.toDataURL("image/jpeg", 0.94).split(",")[1];
    } } } };
    navigator.mediaDevices.getUserMedia = () => { throw Error("unexpected WebKit capture"); };
    window.dispatchEvent(new Event("anycube-cameras-changed"));
    await until(() => $("camera-source").options.length === 3);
    check(!nativeSession, "discovery started capture");
  }
  for (const n of [3,4,5]) {
    showFace(0);
    $("camera-start").click();
    await until(() => app.scanner.running && app.scanner.capture.disabled);
    showFace(n, SCAN_STEPS[0].face);
    await until(() => app.state.size === n && !app.scanner.capture.disabled);
    check(app.scanner.video.videoWidth === 480 && app.scanner.video.videoHeight === 240, "full frame dimensions");
    app.scanner.capture.click();
    check(app.scanner.step === 1 && app.state.scan.filter(Boolean).length === n*n, "first face");
    showFace(n === 3 ? 4 : 3);
    await until(() => app.scanner.capture.disabled);
    check(app.state.size === n && app.scanner.step === 1, "mixed sizes");
    for (const { face } of SCAN_STEPS.slice(1)) {
      showFace(n, face);
      await until(() => app.scanner.found?.cells[0].every((v, i) => Math.abs(v - COLOURS[face][i]) < 12));
      app.scanner.capture.click();
    }
    check(!nativeSession, "camera not released");
    check(!app.scanner.running && app.state.scan === null, "scan completed");
    check(app.state.painted.get(n).facelets.length === 6*n*n, "completed cube size");
    $("tab-camera").click();
  }
  $("tab-paint").click();
  $("sizes").children[5].click();
  mock.plug();
  await until(() => $("app").classList.contains("robot-mode"));
  check(app.state.size === 7, "connection changed editor");
  for (const n of [0, "ambiguous", 6, 3, 4, 5]) {
    cube = n;
    showFace(Number.isInteger(n) && n >= 3 ? n : 3);
    ctx.fillStyle = "#414141";
    ctx.fillRect(44, 44, 126, 154); // The idle flipper leaves only a strip of stickers visible.
    pixels = ctx.getImageData(0, 0, 480, 240);
    check(!detectCubeSize(pixels).n, "idle fixture exposes a measurable face");
    clearPose = () => {
      if (n === "ambiguous") {
        showFace(3);
        const other = picture({ W: 480, H: 240, n: 4, corners: quad(360, 120, 132), stickers: Array(16).fill(1) });
        for (let y = 0; y < 240; y++) {
          const offset = (480*y + 240)*4;
          pixels.data.set(other.data.subarray(offset, offset + 240*4), offset);
        }
        ctx.putImageData(pixels, 0, 0);
      } else showFace(n);
    };
    const before = requests.length;
    const count = () => mock.calls.filter(c => c.path === "/api/robot/measured-size").length;
    const prior = count();
    await until(() => !$("robot-scan").disabled);
    $("robot-scan").click();
    if (!n || n === "ambiguous" || n === 6) {
      await until(() => count() > prior && $("robot-scan").textContent === "Scan & solve");
      await until(() => document.body.innerText.includes(n === 6 ? "MultiCuber requires" : "Show one complete"));
      await until(() => !$("robot-scan").disabled);
      check(requests.length === before && app.state.size === 7, "uncertain or unsupported scan");
    } else {
      await until(() => requests.length > before && app.state.size === n);
      check(requests.at(-1) === n && app.state.size === n, "wrong scan size");
      await until(() => $("robot-scan").textContent === "Scan & solve");
      check(mock.calls.some(c => c.path === "/api/robot/solve" && c.body.size === n && c.body.facelets.length === 6*n*n), `solve from captured ${n} faces: ${document.body.innerText.slice(-1500)}`);
      check(mock.calls.filter(c => c.path === "/api/robot/photo-taken").length === 6*(n-2), "missing photos");
    }
  }
  mock.unplug();
  await until(() => !$("app").classList.contains("robot-mode"));
  check(app.state.size === 7, "manual size restored on disconnect");
  check(!nativeSession, "robot camera not released");
  result.dataset.sizeFrameMs = JSON.stringify(sizeTimings);
  result.textContent = "PASS";
} catch (error) { result.textContent = error.stack; }
</script>
