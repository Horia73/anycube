name: Build release binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: anycube-macos-arm64.tar.gz
          - runner: macos-15-intel
            asset: anycube-macos-x86_64.tar.gz
          - runner: ubuntu-22.04
            asset: anycube-linux-x86_64.tar.gz
          - runner: ubuntu-22.04-arm
            asset: anycube-linux-arm64.tar.gz
          - runner: windows-2022
            asset: anycube-windows-x86_64.zip
    env:
      ASSET: ${{ matrix.asset }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build anycube
        run: cargo +stable build --release --locked --bin anycube
      - name: Smoke test and package on macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target/release/anycube app --help
          target/release/anycube solve R --size 2 --mode fast
          mkdir -p dist
          tar -C target/release -czf "dist/$ASSET" anycube
      - name: Smoke test and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./target/release/anycube.exe app --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/anycube.exe solve R --size 2 --mode fast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist
          Compress-Archive -LiteralPath target/release/anycube.exe -DestinationPath "dist/$env:ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
