[package]
name = "cubenxnxn"
version = "0.1.0"
edition = "2021"
description = "Rubik's cube solver for 2x2x2 to 5x5x5 (larger sizes planned) aiming for shorter solutions than the existing reduction solvers"
license = "MIT"

[dependencies]
rayon = "1"
memmap2 = "0.9"

[[bin]]
name = "cubenxnxn"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
