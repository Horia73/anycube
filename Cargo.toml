[package]
name = "cube444"
version = "0.1.0"
edition = "2021"
description = "4x4x4 Rubik's cube solver aiming for shorter solutions than three-phase reduction"
license = "MIT"

[dependencies]
rayon = "1"
memmap2 = "0.9"

[[bin]]
name = "cube444"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
