[package]
name = "anycube"
version = "0.1.0"
edition = "2021"
description = "Rubik's cube solver for any size from 2x2x2 up, aiming for shorter solutions than the existing reduction solvers"
license = "MIT"
readme = "README.md"
keywords = ["rubiks-cube", "solver", "nxnxn", "puzzle", "search"]
categories = ["algorithms", "command-line-utilities"]
exclude = ["/bench", "/PLAN.md"]

[dependencies]
rayon = "1"
memmap2 = "0.9"

[[bin]]
name = "anycube"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
