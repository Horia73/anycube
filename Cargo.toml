[package]
name = "anycube"
version = "0.1.0"
edition = "2021"
description = "NxNxN Rubik's cube solver with short solutions: 2x2x2, 3x3x3, 4x4x4, 5x5x5, 6x6x6, 7x7x7 and every larger size"
license = "MIT"
readme = "README.md"
keywords = ["rubiks-cube", "rubiks-cube-solver", "nxnxn", "cube-solver", "kociemba"]
categories = ["algorithms", "command-line-utilities"]
exclude = ["/bench", "/PLAN.md"]

[dependencies]
rayon = "1"
memmap2 = "0.9"

[[bin]]
name = "anycube"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
